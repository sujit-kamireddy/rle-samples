schema_version = "1.0.0"

[rle]
name = "echo_env"
version = "1.0.0"
type = "Gym"
subtype = "OpenEnv"

# Required for Execute Rollout to treat this as an enabled Gym/OpenEnv target.
# echo_env's step() never signals done itself (see server/echo_environment.py),
# so this cap is what actually ends each demo episode.
[defaults.reinforcement]
max_episode_steps = 10
