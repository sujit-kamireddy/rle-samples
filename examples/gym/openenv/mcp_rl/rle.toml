schema_version = "1.0.0"
environment_protocol = "mcp_environment"

[rle]
name = "mcp_rl"
version = "1.0.0"
type = "Gym"
subtype = "OpenEnv"

[defaults.reinforcement]
# One model turn may call add and a following turn submits GradeAction.
max_episode_steps = 2
max_completion_tokens = 1024

[train]
model = "qwen3-32b-1"
training_file = "./job_data/train.jsonl"
validation_file = "./job_data/validation.jsonl"
