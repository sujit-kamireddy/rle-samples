schema_version = "1.0.0"

[rle]
name = "code_rl"
version = "1.0.0"

[harness]
type = "Gym"
subtype = "OpenEnv"

[model]
name = "Qwen/Qwen3.8-27B"
renderer_name = "qwen3_8_low_reasoning"

[train.grpo]
learning_rate = 1e-5
lora_rank = 32
group_size = 8
groups_per_batch = 64
num_epochs = 1
max_steps = 150
eval_every = 20
save_every = 20
remove_constant_reward_groups = false
sampling_seed = 42
rollout_failure_rate_abort = 0.2
min_trainable_group_members = 2
