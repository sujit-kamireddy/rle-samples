schema_version = "1.0.0"

[rle]
name = "code_rl"
version = "1.0.0"

[harness]
type = "Gym"
subtype = "OpenEnv"

[model]
name = "qwen3-32b-1"
renderer_name = "qwen3_ext"

[train.grpo]
learning_rate = 0.0003
lora_rank = 32
group_size = 8
groups_per_batch = 128
num_epochs = 1
max_steps = 150
eval_every = 10
save_every = 10
remove_constant_reward_groups = true
sampling_seed = 42
rollout_failure_rate_abort = 0.45
min_trainable_group_members = 2
