schema_version = "1.0.0"

[rle]
name = "code_rl"
version = "1.0.0"

[harness]
type = "gym"

[model]
name = "Qwen/Qwen3-32B"
renderer_name = "qwen3_ext"

[train.grpo]
learning_rate = 2e-5
lora_rank = 32
group_size = 8
groups_per_batch = 16
num_epochs = 1
max_steps = 150
eval_every = 6
save_every = 6
remove_constant_reward_groups = false
sampling_seed = 42
min_trainable_group_members = 2
