# Gym/OpenEnv environment for the code_rl sample.
#
# Every setting `rle.toml` accepts is listed here, including the ones this
# environment leaves unset -- those are commented out, with their default and
# their validation rule, so the whole surface is visible in one file. The
# manifest is parsed in *strict* mode: an unknown key is a hard error, so
# uncommenting a line is always safe but inventing one is not.
#
# `[rle]` and `[defaults]` are the only tables this file has, and both
# describe the published version: everything here is immutable once
# published. There is no `[train]` table any more -- `model`,
# `training_file`, `validation_file` and `suffix` are CLI-flag-only now; see
# the commands below.

# Manifest schema version. Optional; the only accepted value is "1.0.0", which
# is also what is assumed when it is omitted. Required as soon as [defaults] is
# supplied.
schema_version = "1.0.0"

[rle]
# snake_case, starting with a letter.
name = "code_rl"
# Semantic version, MAJOR.MINOR.PATCH. Immutable: publishing a change means a
# new version.
version = "1.0.0"
# "Gym" or "Harness".
type = "Gym"
# "OpenEnv" for Gym; "HostedAgent" or "BYOH" for Harness.
subtype = "OpenEnv"

# RLE decides whether to open an MCP sandbox session for a rollout from this
# field, recorded at publish time and immutable for the version.
environmentProtocol = "mcp_environment"

# Pins the environment container independently of `version`, for build scripts
# that tag images. Not used by the CLI itself -- `azd ai rle publish` takes the
# image as an argument -- but declared so a pinned tag does not fail the strict
# parse.
# imageTag = "1.0.0"

# [rle.harness] is Harness-only and is rejected for a Gym target: RLE reaches
# this environment through the sandbox it schedules from the published image,
# so there is no agent/harness address to register.
# [rle.harness]
# agent_name = "..."
# agent_version = "..."
# invocation_url = "..."


# ---------------------------------------------------------------------------
# [defaults] -- published with the version and returned by the service. Every
# value here is optional and none of them has a service-side default: omitted
# means absent. Supplying any of them requires schema_version = "1.0.0".
# ---------------------------------------------------------------------------

# [defaults.model]
# Informational. Stored with the version; Execute Rollout never reads it.
# Maximum 256 characters.
# name = "qwen3-32b-1"
# The transcript renderer for the policy. Persisted, but not promoted into the
# sampler's own configuration. Maximum 256 characters. Accepted values include
# mai_harmony, mai_harmony_internal, qwen3_instruct, qwen3, qwen3_ext,
# qwen3_disable_thinking, qwen3_5, qwen3_5_ext, qwen3_5_disable_thinking,
# qwen3_5_ext_disable_thinking.
# renderer_name = "qwen3_ext"

[defaults.rollout]
# Output budget for a single model turn: the reasoning plus the whole function
# it produces. Integer > 0, and the effective value is min(value, 8192) -- so
# 8192 is both the cap and what an omitted setting gets. It is set explicitly
# anyway, so the budget this environment was tuned against stays visible and
# survives a change to the service cap. Applies per turn, so each step gets
# it. An untrained Qwen3-32B still overruns it on some problems and is graded
# as a failed turn, which is the signal that teaches it to answer inside the
# budget.
max_completion_tokens = 8192

# Bounds the full rollout sequence length seen by the sampler. Integer > 0.
# max_sequence_tokens = 32767
# Bounds the prompt/context budget handed to the model each turn. Integer > 0.
# max_rollout_input_tokens = 131072
# Declares the tokenizer vocabulary size the rollout expects. Integer > 0.
# vocab_size = 151936
# Bounds how long a single rollout may run before it is aborted. Finite float > 0.
# rollout_timeout_s = 120
# Bounds the size of a single rollout response payload, in bytes. Integer > 0.
# max_rollout_response_bytes = 1048576

[defaults.rollout.gym_openenv]
# Names the action property that receives the model completion's content
# verbatim. It must be a property the environment already declares in its own
# action model, so there is no default. Maximum 128 characters.
model_response_field = "response"

# [defaults.train.grpo]
# Recipe-level GRPO settings. Stored with the version and read by training;
# RLE itself never consumes them. Each is optional and has no default.
# learning_rate = 0.0003                 # finite float > 0
# group_size = 8                         # integer > 0
# groups_per_batch = 128                 # integer > 0
# lora_rank = 32                         # integer > 0
# num_epochs = 1                         # integer > 0
# max_steps = 150                        # integer > 0
# eval_every = 10                        # integer > 0
# save_every = 10                        # integer > 0
# remove_constant_reward_groups = true   # bool
# compute_post_kl = false                # bool
# sampling_seed = 42                     # integer
# rollout_failure_rate_abort = 0.45      # finite float in [0, 1]
# rollout_failure_rate_warn = 0.3        # finite float in [0, 1]
# rollout_failure_window_size = 50       # integer > 0
# rollout_failure_min_attempts = 10      # integer > 0
# min_trainable_group_members = 2        # integer > 0
# group_failure_rate_abort = 0.5         # finite float in [0, 1]


# ---------------------------------------------------------------------------
# Training a published version.
#
# There is no `[train]` table: `model`, `training_file`, `validation_file` and
# `suffix` are CLI-flag-only, and `--task-count N` caps the number of training
# rows read. Any free-form option that used to live in `[train.options]` and
# is not one of the `[defaults.train.grpo]`/`[defaults.rollout]` fields above
# (for example a fixed concurrency or a held-out example count) has no
# manifest home any more and is not accepted by the CLI either.
# ---------------------------------------------------------------------------
# cd rle
# azd ai rle train --rle-version 1.0.0 \
#   --model qwen3-32b-1 \
#   --training-file ./job_data/train.jsonl \
#   --validation-file ./job_data/validation.jsonl \
#   --suffix code-rl
