# catalog.toml controls which Gym/OpenEnv sample directories in this folder
# are shown by `azd ai rle init`'s interactive picker and accepted as an
# explicit `--sample <name>` value.
#
# Samples with no [[sample]] entry here default to visible = true, so new
# sample directories are discoverable automatically unless explicitly hidden.
#
# To stage a new or in-progress sample without exposing it to users yet, add
# an entry with visible = false. The azd CLI's AZD_AI_RLE_ENABLE_ALL
# environment variable bypasses this filter for internal testing.

[[sample]]
name = "code_rl"
visible = false

[[sample]]
name = "math_rl"
visible = true

[[sample]]
name = "code_repair"
visible = false
