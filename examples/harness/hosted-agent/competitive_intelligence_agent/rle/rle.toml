schema_version = "1.0.0"

[rle]
name = "competitive_intelligence_agent"
version = "2.0.1"

[harness]
type = "byoh"
endpoint = "https://<account>.services.ai.azure.com/api/projects/<project>/agents/competitive-intelligence-rle-agent"
protocol = "responses"

[model]
name = "qwen3-32b-1"
renderer_name = "qwen3_ext"

[train.grpo]
learning_rate = 0.0003
lora_rank = 32
group_size = 6
groups_per_batch = 48
num_epochs = 1
max_steps = 14
eval_every = 2
save_every = 2
remove_constant_reward_groups = true
sampling_seed = 42
min_trainable_group_members = 2
