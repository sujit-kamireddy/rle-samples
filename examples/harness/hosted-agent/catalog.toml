# catalog.toml controls which HostedAgent sample directories in this folder are
# shown by `azd ai rle init`'s interactive picker and accepted as an explicit
# `--sample <name>` value.
#
# Samples with no [[sample]] entry here default to visible = true, so new
# sample directories are discoverable automatically unless explicitly hidden.
#
# To stage a new or in-progress sample without exposing it to users yet, add
# an entry with visible = false. The azd CLI's AZD_AI_RLE_ENABLE_ALL
# environment variable bypasses this filter for internal testing.
#
# `azd ai rle init` always prompts with the visible samples, even when only one
# is available, so the chosen sample is always stated back to the user.
#
# Today every sample in this folder is hidden, so the HostedAgent subtype
# offers nothing by default. Reach the one below with AZD_AI_RLE_ENABLE_ALL=true.

[[sample]]
name = "competitive_intelligence_agent"
# Hidden pending review. Reachable for internal testing with
# AZD_AI_RLE_ENABLE_ALL=true, which bypasses this filter for both the
# interactive picker and an explicit --sample.
visible = false
