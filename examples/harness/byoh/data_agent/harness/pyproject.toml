[project]
name = "agentic-rle-fineenvs-harness"
version = "0.1.0"
description = "opencode harness for FineEnvs/data-agent-harbor-train, standalone and ACA-deployable"
requires-python = ">=3.12"
dependencies = [
    # Deliberately small: `opencode` runs in this container and reaches no
    # sandbox provider, so there is nothing else to depend on. See
    # `server/app.py`'s module docstring.
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "httpx>=0.27",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]
