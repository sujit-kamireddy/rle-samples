schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0040_756_40756003_qa_2"
description = "What is the total number of benign (B) and malignant (M) tumors in the dataset?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0040/756/40756003.ipynb_qa_2"
kaggle_dataset_name = "uciml/breast-cancer-wisconsin-data"
gold_answer = "357 benign, 212 malignant"
reward_mode_initial = "exact_short"
package_tier = 1
difficulty_level = 1
difficulty_tier = "easy"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "uciml__breast-cancer-wisconsin-data"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "uciml/breast-cancer-wisconsin-data"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "357 benign, 212 malignant"
QUESTION = "What is the total number of benign (B) and malignant (M) tumors in the dataset?"
REWARD_MODE = "exact_short"

[agent]
timeout_sec = 900.0

[solution.env]
