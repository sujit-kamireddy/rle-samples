[task]
name = "data-agent-eval-v1/0115_504_115504947_qa_4"
description = "What is the median value of North American sales?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
