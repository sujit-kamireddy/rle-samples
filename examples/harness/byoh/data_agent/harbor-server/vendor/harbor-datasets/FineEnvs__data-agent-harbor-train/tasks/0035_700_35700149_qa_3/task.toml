schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0035_700_35700149_qa_3"
description = "Among the categorical variables (sex, smoker, region), which one shows the most significant visual difference in average insurance charges according to the swarm plot and bar chart analysis?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0035/700/35700149.ipynb_qa_3"
kaggle_dataset_name = "mirichoi0218/insurance"
gold_answer = "Smoker"
reward_mode_initial = "exact_short"
package_tier = 1
difficulty_level = 2
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "mirichoi0218__insurance"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "mirichoi0218/insurance"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Smoker"
QUESTION = "Among the categorical variables (sex, smoker, region), which one shows the most significant visual difference in average insurance charges according to the swarm plot and bar chart analysis?"
REWARD_MODE = "exact_short"

[agent]
timeout_sec = 900.0

[solution.env]
