HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "carrie1/ecommerce-data"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "280206.02"
QUESTION = "What is the highest monetary value spent by a customer in the Best Customers segment (RFMScore 444)?"
