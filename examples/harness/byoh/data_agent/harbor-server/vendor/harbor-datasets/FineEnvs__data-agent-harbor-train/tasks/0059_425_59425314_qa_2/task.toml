schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-train-v1/0059_425_59425314_qa_2"
description = "What year between 2003 and 2017 had the highest total number of crimes recorded?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0059/425/59425314.ipynb_qa_2"
kaggle_dataset_name = "wosaku/crime-in-vancouver"
gold_answer = "2003"
reward_mode_initial = "numeric"
package_tier = 1
difficulty_level = 2
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "wosaku__crime-in-vancouver"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "wosaku/crime-in-vancouver"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "2003"
QUESTION = "What year between 2003 and 2017 had the highest total number of crimes recorded?"
REWARD_MODE = "numeric"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
