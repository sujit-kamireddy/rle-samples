HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "pavansubhasht/ibm-hr-analytics-attrition-dataset"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "No"
QUESTION = "Does the analysis indicate a statistically significant relationship between education level and employee attrition?"
REWARD_MODE = "exact_bool"

