schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0086_644_86644069_qa_3"
description = "Which education level category has the largest population in India according to the census data?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0086/644/86644069.ipynb_qa_3"
kaggle_dataset_name = "danofer/india-census"
gold_answer = "Primary_Education"
reward_mode_initial = "exact_short"
package_tier = 1
difficulty_level = 2
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "danofer__india-census"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "danofer/india-census"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Primary_Education"
QUESTION = "Which specific education level category (e.g., Below_Primary_Education, Primary_Education, Middle_Education, Secondary_Education, Higher_Education, Graduate_Education, Other_Education) has the largest population in India according to the census data? Do not include aggregate columns like Literate_Education, Illiterate_Education, or Total_Education."
REWARD_MODE = "exact_short"

[agent]
timeout_sec = 900.0

[solution.env]
