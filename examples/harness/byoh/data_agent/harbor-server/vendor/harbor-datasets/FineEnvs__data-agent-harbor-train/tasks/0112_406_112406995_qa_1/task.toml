schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0112_406_112406995_qa_1"
description = "What was the original difference in the number of data points between the edible and poisonous mushroom classes before balancing the dataset?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0112/406/112406995.ipynb_qa_1"
kaggle_dataset_name = "uciml/mushroom-classification"
gold_answer = "292"
reward_mode_initial = "numeric"
package_tier = 1
difficulty_level = 1
difficulty_tier = "easy"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "uciml__mushroom-classification"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "uciml/mushroom-classification"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "292"
QUESTION = "What was the original difference in the number of data points between the edible and poisonous mushroom classes before balancing the dataset?"
REWARD_MODE = "numeric"

[agent]
timeout_sec = 900.0

