schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0059_055_59055646_qa_1"
description = "What is the percentage of credit card default cases (DEFAULT=1) in the entire dataset before splitting into training and test sets?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0059/055/59055646.ipynb_qa_1"
kaggle_dataset_name = "uciml/default-of-credit-card-clients-dataset"
gold_answer = "22.12%"
reward_mode_initial = "flexible"
package_tier = 1
difficulty_level = 1
difficulty_tier = "easy"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "uciml__default-of-credit-card-clients-dataset"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "uciml/default-of-credit-card-clients-dataset"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "22.12%"
QUESTION = "What is the percentage of credit card default cases (DEFAULT=1) in the entire dataset before splitting into training and test sets?"
REWARD_MODE = "flexible"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
