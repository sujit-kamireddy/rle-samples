# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "aariyan101__usa-housingcsv"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "aariyan101/usa-housingcsv"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "82,288.22"
QUESTION = "What is the mean absolute error (MAE) of the model's predictions? Use a Linear Regression model trained on a train/test split (test_size=0.4, random_state=101) with all numeric features ('Avg. Area Income', 'Avg. Area House Age', 'Avg. Area Number of Rooms', 'Avg. Area Number of Bedrooms', 'Area Population') to predict 'Price'. Report the MAE on the test set, rounded to 2 decimal places."
REWARD_MODE = "numeric"

[agent]
timeout_sec = 900.0

