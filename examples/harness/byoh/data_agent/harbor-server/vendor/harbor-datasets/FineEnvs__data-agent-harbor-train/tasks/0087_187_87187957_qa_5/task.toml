schema_version = "1.2"
artifacts = []

[task]
name = "train-verify/0087_187_87187957_qa_5"
description = "How many users are included in the top 50 similarity index list after calculating Pearson correlations?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0087/187/87187957.ipynb_qa_5"
kaggle_dataset_name = "zygmunt/goodbooks-10k"
gold_answer = "50"
reward_mode_initial = "numeric"
package_tier = 1
difficulty_level = 3
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "zygmunt__goodbooks-10k"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "zygmunt/goodbooks-10k"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "50"
QUESTION = "How many users are included in the top 50 similarity index list after calculating Pearson correlations?"
REWARD_MODE = "numeric"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
