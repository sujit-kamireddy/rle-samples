schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0110_147_110147085_qa_1"
description = "Which ocean proximity category contains the highest number of districts, and how many districts are in that category?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0110/147/110147085.ipynb_qa_1"
kaggle_dataset_name = "camnugent/california-housing-prices"
gold_answer = "<1H OCEAN with 9136 districts"
reward_mode_initial = "exact_short"
package_tier = 0
difficulty_level = 1
difficulty_tier = "easy"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "camnugent__california-housing-prices"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "camnugent/california-housing-prices"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "<1H OCEAN with 9136 districts"
QUESTION = "Which ocean proximity category contains the highest number of districts, and how many districts are in that category?"
REWARD_MODE = "exact_short"

[agent]
timeout_sec = 900.0

[solution.env]
