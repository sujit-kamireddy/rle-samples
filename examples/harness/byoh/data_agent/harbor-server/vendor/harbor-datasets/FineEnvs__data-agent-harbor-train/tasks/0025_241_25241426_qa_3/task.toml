schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0025_241_25241426_qa_3"
description = "Do spam messages have more words than ham messages based on the KDE plot?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0025/241/25241426.ipynb_qa_3"
kaggle_dataset_name = "uciml/sms-spam-collection-dataset"
gold_answer = "Yes"
reward_mode_initial = "exact_bool"
package_tier = 2
difficulty_level = 3
difficulty_tier = "medium"
[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "uciml__sms-spam-collection-dataset"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "uciml/sms-spam-collection-dataset"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Yes"
QUESTION = "Do spam messages have more words than ham messages based on the KDE plot?"
REWARD_MODE = "exact_bool"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
