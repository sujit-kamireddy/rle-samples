schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0040_808_40808132_qa_5"
description = "Which machine learning model achieved the highest median accuracy through k-fold cross-validation, and what was this median accuracy value?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0040/808/40808132.ipynb_qa_5"
kaggle_dataset_name = "uciml/glass"
gold_answer = "Decision trees (entropy-based) with median accuracy of 70%"
reward_mode_initial = "flexible"
package_tier = 1
difficulty_level = 4
difficulty_tier = "hard"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "uciml__glass"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "uciml/glass"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Random Forest with median accuracy of 0.8095"
QUESTION = "Which machine learning model achieved the highest median accuracy through k-fold cross-validation, and what was this median accuracy value?"
REWARD_MODE = "flexible"

[agent]
timeout_sec = 900.0

[solution.env]
