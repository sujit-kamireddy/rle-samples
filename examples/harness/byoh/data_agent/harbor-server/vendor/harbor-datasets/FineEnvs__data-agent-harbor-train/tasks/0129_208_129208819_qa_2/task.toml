schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-train-v1/0129_208_129208819_qa_2"
description = "Which country has the highest number of respondents willing to spend more than $59 per month on learning after outlier removal?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0129/208/129208819.ipynb_qa_2"
kaggle_dataset_name = "freecodecamp/the-freecodecamp-2017-new-coder-survey"
gold_answer = "United States of America"
reward_mode_initial = "exact_short"
package_tier = 1
difficulty_level = 3
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "freecodecamp__the-freecodecamp-2017-new-coder-survey"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "freecodecamp/the-freecodecamp-2017-new-coder-survey"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "United States of America"
QUESTION = "Which country has the highest number of respondents willing to spend more than $59 per month on learning after outlier removal?"
REWARD_MODE = "exact_short"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
