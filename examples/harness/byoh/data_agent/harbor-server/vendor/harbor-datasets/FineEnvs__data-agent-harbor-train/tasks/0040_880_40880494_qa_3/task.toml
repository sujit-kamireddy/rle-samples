schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0040_880_40880494_qa_3"
description = "Is the mean of the x values in the training data higher than the mean of the y values?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0040/880/40880494.ipynb_qa_3"
kaggle_dataset_name = "andonians/random-linear-regression"
gold_answer = "Yes"
reward_mode_initial = "exact_bool"
package_tier = 1
difficulty_level = 1
difficulty_tier = "easy"
[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "andonians__random-linear-regression"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "andonians/random-linear-regression"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Yes"
QUESTION = "Is the mean of the x values in the training data higher than the mean of the y values?"
REWARD_MODE = "exact_bool"

[agent]
timeout_sec = 900.0

[solution.env]
