schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0039_560_39560761_qa_1"
description = "What is the proportion of diabetic patients (Outcome=1) in the PIMA Indians diabetes dataset?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0039/560/39560761.ipynb_qa_1"
kaggle_dataset_name = "uciml/pima-indians-diabetes-database"
gold_answer = "34.9%"
reward_mode_initial = "flexible"
package_tier = 2
difficulty_level = 1
difficulty_tier = "easy"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "uciml__pima-indians-diabetes-database"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "uciml/pima-indians-diabetes-database"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "34.9%"
QUESTION = "What is the proportion of diabetic patients (Outcome=1) in the PIMA Indians diabetes dataset? Express as a percentage rounded to one decimal place."
REWARD_MODE = "flexible"

[agent]
timeout_sec = 900.0

