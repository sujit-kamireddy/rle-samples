schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0034_023_34023168_qa_2"
description = "What is the highest price of a wine in the dataset, and which specific wine has this price?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0034/023/34023168.ipynb_qa_2"
kaggle_dataset_name = "zynicide/wine-reviews"
gold_answer = "3300.0, Château les Ormes Sorbet 2013 Médoc"
reward_mode_initial = "flexible"
package_tier = 0
difficulty_level = 1
difficulty_tier = "easy"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "zynicide__wine-reviews"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "zynicide/wine-reviews"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "3300.0, Château les Ormes Sorbet 2013 Médoc"
QUESTION = "What is the highest price of a wine in the dataset, and which specific wine has this price?"
REWARD_MODE = "flexible"
ATOL = "0.0"
RTOL = "0.0"

[agent]
timeout_sec = 900.0

[solution.env]
