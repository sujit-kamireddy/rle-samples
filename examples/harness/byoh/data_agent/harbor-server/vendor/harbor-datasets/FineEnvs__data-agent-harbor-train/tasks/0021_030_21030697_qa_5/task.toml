schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0021_030_21030697_qa_5"
description = "What percentage of projects in the original dataset were either failed or successful (excluding canceled, undefined, live, and suspended states)?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0021/030/21030697.ipynb_qa_5"
kaggle_dataset_name = "kemical/kickstarter-projects"
gold_answer = "87.6%"
reward_mode_initial = "flexible"
package_tier = 2
difficulty_level = 2
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "kemical__kickstarter-projects"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "kemical/kickstarter-projects"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "87.6%"
QUESTION = "What percentage of projects in the original dataset were either failed or successful (excluding canceled, undefined, live, and suspended states)?"
REWARD_MODE = "flexible"

[agent]
timeout_sec = 900.0

[solution.env]
