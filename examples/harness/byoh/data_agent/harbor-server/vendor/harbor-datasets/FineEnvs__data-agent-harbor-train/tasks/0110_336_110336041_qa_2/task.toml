description = "How many missing values were present in the 'Unnamed: 32' column before it was dropped from the dataset?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
