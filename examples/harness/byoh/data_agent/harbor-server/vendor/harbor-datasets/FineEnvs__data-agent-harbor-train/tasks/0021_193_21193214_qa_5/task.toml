schema_version = "1.2"
artifacts = []

[task]
name = "train-verify/0021_193_21193214_qa_5"
description = "What is the coefficient of determination (R²) for the linear regression model analyzing the relationship between log(PlanetaryMass) and log(Radius) of exoplanets?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0021/193/21193214.ipynb_qa_5"
kaggle_dataset_name = "mrisdal/open-exoplanet-catalogue"
gold_answer = "0.7419577761281136"
reward_mode_initial = "numeric"
package_tier = 1
difficulty_level = 3
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "mrisdal__open-exoplanet-catalogue"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "mrisdal/open-exoplanet-catalogue"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "0.7419577761281136"
QUESTION = "What is the coefficient of determination (R²) for the linear regression model analyzing the relationship between log(PlanetaryMass) and log(Radius) of exoplanets?"
REWARD_MODE = "numeric"
ATOL = "0.001"
RTOL = "0.005"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
