schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-train-v1/0035_022_35022939_qa_2"
description = "Which dog breed appears most frequently in the Austin Animal Shelter dataset after filtering for dogs only?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0035/022/35022939.ipynb_qa_2"
kaggle_dataset_name = "aaronschlegel/austin-animal-center-shelter-outcomes-and"
gold_answer = "Pit Bull Mix"
reward_mode_initial = "exact_short"
package_tier = 1
difficulty_level = 2
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "aaronschlegel__austin-animal-center-shelter-outcomes-and"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "aaronschlegel/austin-animal-center-shelter-outcomes-and"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Pit Bull Mix"
QUESTION = "Which dog breed appears most frequently in the Austin Animal Shelter dataset after filtering for dogs only?"
REWARD_MODE = "exact_short"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
