schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-train-v1/0063_350_63350967_qa_3"
description = "Which country has the lowest average temperature in the dataset between 1980-2013 according to the grouped analysis?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0063/350/63350967.ipynb_qa_3"
kaggle_dataset_name = "berkeleyearth/climate-change-earth-surface-temperature-data"
gold_answer = "Canada"
reward_mode_initial = "exact_short"
package_tier = 1
difficulty_level = 3
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "berkeleyearth__climate-change-earth-surface-temperature-data"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "berkeleyearth/climate-change-earth-surface-temperature-data"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Canada"
QUESTION = "Which country has the lowest average temperature in the dataset between 1980-2013 according to the grouped analysis?"
REWARD_MODE = "exact_short"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
