schema_version = "1.2"
artifacts = []

[task]
name = "train-verify2/0026_528_26528881_qa_3"
description = "Is the Mean Absolute Error (MAE) on the test dataset higher than the MAE on the training dataset after model evaluation?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0026/528/26528881.ipynb_qa_3"
kaggle_dataset_name = "toramky/automobile-dataset"
gold_answer = "yes"
reward_mode_initial = "exact_bool"
package_tier = 1
difficulty_level = 4
difficulty_tier = "hard"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 1024
storage_mb = 5120
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "toramky__automobile-dataset"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "toramky/automobile-dataset"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "yes"
QUESTION = "Is the Mean Absolute Error (MAE) on the test dataset higher than the MAE on the training dataset after model evaluation?"
REWARD_MODE = "exact_bool"
ATOL = "0.0"
RTOL = "0.0"

[agent]
# Capped at 600s (10 min) to kill the long-tail stuck-agent cases without
# cutting off legitimate complex trials. Median Phase B trial is 60-120s;
# legitimate L4/L5 tasks can hit 200-300s; anything past 600s is almost
# certainly a stuck agent loop.
timeout_sec = 600.0

[solution.env]
