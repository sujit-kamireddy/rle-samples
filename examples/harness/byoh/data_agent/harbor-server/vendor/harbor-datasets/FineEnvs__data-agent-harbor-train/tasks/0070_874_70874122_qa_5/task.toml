schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0070_874_70874122_qa_5"
description = "Is the temperature distribution in the dataset both skewed and platykurtic based on statistical measurements?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
