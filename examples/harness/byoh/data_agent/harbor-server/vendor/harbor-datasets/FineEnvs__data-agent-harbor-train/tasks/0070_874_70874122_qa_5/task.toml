[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "budincsevity__szeged-weather"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "budincsevity/szeged-weather"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Yes"
QUESTION = "Is the temperature distribution in the dataset both skewed and platykurtic based on statistical measurements?"
REWARD_MODE = "exact_bool"

[agent]
timeout_sec = 900.0

