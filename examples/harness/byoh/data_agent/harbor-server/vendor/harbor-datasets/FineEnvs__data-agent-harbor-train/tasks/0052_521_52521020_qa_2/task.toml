schema_version = "1.2"
artifacts = []

[task]
name = "data-agent-eval-v1/0052_521_52521020_qa_2"
description = "What is the most common repayment interval type for Kiva loans in Rwanda?"
authors = []
keywords = ["data-agent", "data-analysis", "kaggle"]

[metadata]
source_dataset = "jupyter-agent/jupyter-agent-dataset"
source_row_id = "0052/521/52521020.ipynb_qa_2"
kaggle_dataset_name = "kiva/data-science-for-good-kiva-crowdfunding"
gold_answer = "Irregular"
reward_mode_initial = "exact_short"
package_tier = 1
difficulty_level = 2
difficulty_tier = "medium"

[environment]
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

# Pre-agent hook: Harbor runs the command AFTER container start and BEFORE the
# agent setup begins. We use it to pull this task's bucket prefix into
# /home/user/input/. See environment/pull_bucket.py.
[environment.healthcheck]
command = "python3 /opt/pull_bucket.py && [ -n \"$(ls /home/user/input)\" ]"
interval_sec = 2.0
timeout_sec = 180.0
start_period_sec = 5.0
start_interval_sec = 2.0
retries = 30

[environment.env]
HF_BUCKET = "AdithyaSK/jupyter-agent-kaggle-all"
BUCKET_PREFIX = "kiva__data-science-for-good-kiva-crowdfunding"
HF_TOKEN = "${HF_TOKEN}"
KAGGLE_DATASET_NAME = "kiva/data-science-for-good-kiva-crowdfunding"

[verifier]
timeout_sec = 120.0

[verifier.env]
EXPECTED_ANSWER = "Irregular"
QUESTION = "What is the most common repayment interval type for Kiva loans in Rwanda?"
REWARD_MODE = "exact_short"

[agent]
timeout_sec = 900.0

[solution.env]
