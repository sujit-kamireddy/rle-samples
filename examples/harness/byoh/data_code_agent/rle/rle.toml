schema_version = "1.0.0"

[rle]
name = "data_code_agent"
version = "1.0.0"

[harness]
type = "Harness"
subtype = "BYOH"
invocation_url = "https://your-harness.example.com/invoke"

[model]
name = "mai/mai-code-1.1-flash"
renderer_name = "mai_harmony_internal"

[train.grpo]
learning_rate = 5e-5
lora_rank = 32
group_size = 16
groups_per_batch = 8
num_epochs = 2
max_steps = 128
eval_every = 4
save_every = 4
remove_constant_reward_groups = true
sampling_seed = 42
rollout_failure_rate_abort = 0.45
min_trainable_group_members = 2
