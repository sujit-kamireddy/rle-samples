[rle]
name = "data_code_agent_byoh"
version = "1.0.0"
type = "Harness"
subtype = "BYOH"
baseUrl = "https://your-backend-url.com/invoke"

# How this environment is usually trained. `azd ai rle train` reads these, so a run
# is one command; any flag overrides them for a single run without editing this file.
# Kept separate from [defaults], which describes the published version and must match
# what the service returned.
[train]
model = "qwen3-32b-1"
training_file = "../job_data/train.jsonl"
validation_file = "../job_data/validation.jsonl"

[train.options]
group_size = 4
max_concurrent_rollouts = 8
